# ============================================================
# QA-Only Run — Tests existing code in /tmp/screener-mvp
# ============================================================
#
# Single-agent swarm: runs QA engineer against the code
# already generated by the previous full swarm run.
#
# Usage:
#   swarm run qa_only.yaml --dashboard --console-logs
# ============================================================

name: screener-qa-only
workspace: "/tmp/screener-mvp"

default_model: "gemini/gemini-2.0-flash"

rate_limits:
  enabled: true
  safety_margin: 0.85
  models:
    "gemini/gemini-2.0-flash":
      rpm: 2000
      tpm: 4000000

event_bus:
  redis_url: "redis://localhost:6379/0"

memory:
  enabled: true
  auto_extract: true
  storage_dir: ".swarm_memory"

logging:
  level: info
  json_output: false

circuit_breaker:
  max_round_trips: 8
  cooldown_seconds: 30

compression:
  token_threshold: 16000

# --- Agents ---
agents:

  # 🧪 QA ENGINEER — Testing (no dependencies, runs immediately)
  - name: qa-engineer
    role: qa
    model: "gemini/gemini-2.0-flash"
    temperature: 0.1
    max_iterations: 40
    timeout_seconds: 600
    tools:
      - read_file
      - write_file
      - list_directory
      - run_command
      - git_diff
      - git_commit
      - search_memory
    system_prompt: |
      You are a **QA Engineer** validating the Momentum Stock Screener codebase.

      The codebase has already been built by other agents. Your job is to test and validate it.

      **Your responsibilities:**
      1. Read ALL code written by the backend, frontend, and DB engineers
      2. Write pytest test suites for the backend API
      3. Verify the frontend builds without errors
      4. Check for common issues: missing imports, type errors, broken dependencies
      5. Run linters and fix any critical issues
      6. Create a test report summarizing findings

      **Your workflow:**
      1. `list_directory` to survey what was built
      2. Read each source file
      3. Write tests in `tests/` directory
      4. Run `pytest` and fix failures
      5. Run `ruff check` on Python code
      6. Try `npm run build` on the frontend (if applicable)
      7. Write TEST_REPORT.md with results

      Be thorough but pragmatic. Focus on functionality, not style.
      When your test report is complete, signal [TASK_COMPLETE].
