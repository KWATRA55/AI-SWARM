# ============================================================
# Screener MVP — Multi-Agent AI Swarm Configuration
# ============================================================
#
# 5-agent swarm for building a full-stack momentum screener:
#   - Architect (Pro)     → designs architecture, reviews code
#   - Backend Dev (Flash) → FastAPI backend
#   - Frontend Dev (Flash)→ Next.js frontend
#   - DB Engineer (Flash) → database schema & queries
#   - QA Engineer (Lite)  → testing, linting, validation
#
# Usage:
#   swarm validate screener_mvp.yaml
#   swarm run screener_mvp.yaml --console-logs
# ============================================================

name: screener-mvp
workspace: "${SWARM_WORKSPACE:-/tmp/screener-mvp}"

# --- Session Replay (diagnostic — disable after optimization) ---
enable_session_replay: true

# --- Global defaults ---
default_model: "gemini/gemini-2.5-flash"

# --- Rate Limits (from your Gemini API dashboard) ---
rate_limits:
  enabled: true
  safety_margin: 0.85
  models:
    "gemini/gemini-2.5-pro":
      rpm: 150
      tpm: 2000000
    "gemini/gemini-2.5-flash":
      rpm: 1000
      tpm: 1000000
    "gemini/gemini-2.0-flash":
      rpm: 2000
      tpm: 4000000
    "gemini/gemini-2.0-flash-lite":
      rpm: 4000
      tpm: 4000000

# --- Infrastructure ---
event_bus:
  redis_url: "redis://localhost:6379/0"

memory:
  enabled: true
  auto_extract: true
  storage_dir: ".swarm_memory"
  backend: "json"

logging:
  level: info
  json_output: false

circuit_breaker:
  max_round_trips: 8
  cooldown_seconds: 30

compression:
  token_threshold: 16000

# --- Agents ---
agents:

  # 🧠 ARCHITECT (Pro Model)
  - name: architect
    role: architect
    model: "gemini/gemini-2.5-pro"
    temperature: 0.3
    max_iterations: 8
    timeout_seconds: 900
    token_budget: 30000
    tools:
      - read_file
      - write_file
      - list_directory
      - run_command
      - search_memory
    system_prompt: |
      You are a Lead Architect. Design system architecture, define API contracts, create project structure. Write ALL files in one response using parallel tool calls.

  # ⚙️ BACKEND DEV (Flash Model)
  - name: backend-dev
    role: backend
    model: "gemini/gemini-2.5-flash"
    temperature: 0.2
    max_iterations: 10
    timeout_seconds: 600
    token_budget: 25000
    depends_on: [architect]
    tools:
      - read_file
      - write_file
      - list_directory
      - run_command
      - search_memory
    system_prompt: |
      You are a Senior Backend Engineer. Implement FastAPI endpoints, Pydantic models, and business logic. Read the architect's files first. Write ALL files in one response.

  # 🎨 FRONTEND DEV (Flash Model)
  - name: frontend-dev
    role: frontend
    model: "gemini/gemini-2.5-flash"
    temperature: 0.2
    max_iterations: 10
    timeout_seconds: 600
    token_budget: 25000
    depends_on: [architect]
    tools:
      - read_file
      - write_file
      - list_directory
      - run_command
      - search_memory
    system_prompt: |
      You are a Senior Frontend Engineer. Build React/Next.js components with TypeScript. Read the architect's files first. Write ALL files in one response.

  # 🗄️ DB ENGINEER (Flash Model)
  - name: db-engineer
    role: database
    model: "gemini/gemini-2.5-flash"
    temperature: 0.1
    max_iterations: 8
    timeout_seconds: 600
    token_budget: 25000
    depends_on: [architect]
    tools:
      - read_file
      - write_file
      - list_directory
      - run_command
      - search_memory
    system_prompt: |
      You are a Database Engineer. Implement SQLAlchemy models, migrations, and optimized queries. Read the architect's files first. Write ALL files in one response.

  # 🧪 QA ENGINEER (Flash Model)
  - name: qa-engineer
    role: qa
    model: "gemini/gemini-2.0-flash"
    temperature: 0.1
    max_iterations: 8
    timeout_seconds: 600
    token_budget: 25000
    depends_on: [backend-dev, frontend-dev, db-engineer]
    tools:
      - read_file
      - write_file
      - list_directory
      - run_command
      - search_memory
    system_prompt: |
      You are a QA Engineer. Read all code, write pytest tests, run linters, create TEST_REPORT.md. Be thorough but pragmatic.

